<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Floating Color Palettes</title>
        <link href="css/style.css" rel="stylesheet">
        <link 
            rel="stylesheet" 
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" 
            integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" 
            crossorigin="anonymous" 
            referrerpolicy="no-referrer"
        >
    </head>
    <body>
        <div class="color-palette" id="bc-1">
            <h2>
                Enchanted Forest
                <br>
                <i class="fa-solid fa-tree"></i>
            </h2>
            <h4 class="color" id="color-1">#c4e7d4</h4>
            <h4 class="color" id="color-2">#b9c0da</h4>
            <h4 class="color" id="color-3">#998da0</h4>
        </div>
        <div class="color-palette" id="bc-2">
            <h2>
                Evening Nap
                <br>
                <i class="fa-solid fa-bed"></i>
            </h2>
            <h4 class="color" id="color-4">#b9abab</h4>
            <h4 class="color" id="color-5">#ccbcbc</h4>
            <h4 class="color" id="color-6">#f1e3e4</h4>
        </div>
        <div class="color-palette" id="bc-3">
            <h2>
                Safari Night
                <br>
                <i class="fa-solid fa-moon"></i>
            </h2>
            <h4 class="color" id="color-7">#7a725c</h4>
            <h4 class="color" id="color-8">#d0cd94</h4>
            <h4 class="color" id="color-9">#3c787e</h4>
        </div>
    </body>
</html>
