<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Three Profile Cards</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="single-column">
            
            <!-- Flexbox container -->
            <div id="card-container">

                <!-- Flexbox item -->
                <div class="card">
                    <h3>Dog</h3>
                    <img src="images/dog.jpg">
                    <p>
                        What type of dog is this?
                    </p>
                    <a href="#" class="button">
                        <span>choose here</span>
                    </a>
                </div>

                <!-- Flexbox item -->
                <div class="card">
                    <h3>Cat</h3>
                    <img src="images/cat.jpg">
                    <p>
                        What type of cat is this?
                    </p>
                    <a href="#" class="button">
                        <span>choose here</span>
                    </a>
                </div>

                <!-- Flexbox item -->
                <div class="card">
                    <h3>Lizard</h3>
                    <img src="images/lizard.jpg">
                    <p>
                        What type of lizard is this?
                    </p>
                    <a href="#" class="button">
                        <span>choose here</span>
                    </a>
                </div>

            </div>
        </div>
    </body>
</html>
