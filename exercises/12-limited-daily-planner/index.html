<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Limited Daily Planner</title>
        <link href="css/style.css" rel="stylesheet">
    </head>
    <body>
        <div id="morning">
            <h2>MORNING</h2>
            <div>
                <ul>
                    <li class="important">
                        Feed Cat
                        <a href="#" class="button">Complete</a>
                    </li>
                    <li class="important">
                        Take sister to school
                        <a href="#" class="button">Complete</a>
                    </li>
                    <li>Clean<a href="#" class="button">Complete</a></li>
                </ul>
                
            </div>
        </div>
        <div id=afternoon>
            <h2>AFTERNOON</h2>
            <div>
                <ul>
                    <li class="completed">Complete class work</li>
                    <li>Stretch<a href="#" class="button">Complete</a></li>
                    <li class="important">
                        Call Mom
                        <a href="#" class="button">Complete</a>
                    </li>
                </ul>
                
            </div>
        </div>
        <div id="evening">
            <h2>EVENING</h2>
            <div>
                <ul>
                    <li class="completed" >Make tea</li>
                    <li class="completed">Do Homework</li>
                    <li class="important completed">Read</li>
                </ul>
                
            </div>
        </div>
    </body>
</html>
