<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <div class="row">
                <div class="post-it green">
                    <h2>Daily Tips</h2>
                    <ul>
                        <li>Stretch</li>
                        <li>drink water</li>
                        <li>eat healthy</li>
                    </ul>
                </div>
                <div class="post-it yellow">
                    <h2 id="motive">
                        Take one day at a time
                    </h2>
                </div>
                <div class="post-it blue">
                    <h2>Quick Reminder</h2>
                    <p>
                        <span id="reminder">Do your laundry,</span> 
                        Clean the bathroom and organize pantry
                    </p>
                </div>
                <br>
                <div class="post-it pink">
                    <h2>Groceries</h2>
                    <ul>
                        <li>Fruits</li>
                        <li>Juice</li>
                        <li>Cat food</li>
                        <li>Cat treats</li>
                    </ul>
                </div>
                <div class="post-it white">
                    <img 
                        src="images/Kitty.jpg"
                        alt="cat and yarn ball"
                        class="cat"
                    >
                </div>
                <div class="post-it purple">
                    <h2>Fun Fact Of The Day</h2>
                    <p>
                        Turtle can live up to 400-500 years!
                    </p>
                </div>
            </div>
        </div>
    </body>
</html>
